name: Original portfolio evidence
on:
  pull_request:
    paths:
      - scripts/capture-original.mjs
      - .github/workflows/source-reference.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        width: [390, 1440]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-original.mjs
        env:
          CAPTURE_WIDTH: ${{ matrix.width }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: source-evidence-${{ matrix.width }}
          path: source-evidence/
          retention-days: 7
