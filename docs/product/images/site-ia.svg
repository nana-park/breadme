<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1784" viewBox="0 0 1800 1784" role="img" aria-labelledby="title description">
<title id="title">breadme 사이트 구조 (IA)</title>
<desc id="description">Header 상위 메뉴는 HOME, ABOUT, PROJECTS, AWARDS, CONTACT다. ABOUT 하위에는 breadme, Career, Qualified가 있고 PROJECTS 하위에는 Products, Research, Articles, Lectures가 있다. ABOUT와 breadme, PROJECTS와 Products는 각각 같은 페이지를 연다. 메뉴의 고유 페이지는 10개다. Projects 본문은 LLM-based Voice IVR, Hopzie, Mentor AI 상세 3개로 연결되고 Lectures 본문도 같은 Mentor AI 상세로 연결된다. Articles는 6쪽의 목록과 18개 해시 읽기 상태를 가진 한 페이지다. Enjoy는 메뉴에 노출되지 않지만 직접 주소로 접근할 수 있다. 총 고유 HTML 페이지는 14개다. Header의 자료 조작과 Footer는 페이지 계층 및 페이지 수에서 제외된다.</desc>
